name: tests

# Su main e su ogni pull request. Il push e' filtrato su main apposta: senza il
# filtro un branch aperto nello stesso repo farebbe girare due volte lo stesso
# job, una per il push e una per la PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 e' il minimo dichiarato in requirements.txt, 3.14 la piu' recente.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      # I test student verificano loss/gradienti e cache con tensori sintetici.
      # Usa PyTorch CPU senza scaricare CUDA, modelli o dataset remoti.
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.11' --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: unittest discover
        run: python -m unittest discover -v tests
